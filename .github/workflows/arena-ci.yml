name: Arena policy checks
on:
  pull_request:
    paths: ['policies/**', 'arena/**', 'sdk/**', 'gamecore.js', 'vendor/onnxruntime/**', 'tests/arena/**', '.github/workflows/arena-ci.yml', '.github/workflows/arena-release.yml']
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths: ['policies/**', 'arena/**', '!arena/results/**', '!arena/benchmarks/**', 'sdk/**', 'gamecore.js', 'vendor/onnxruntime/**', 'tests/arena/**', '.github/workflows/arena-ci.yml', '.github/workflows/arena-release.yml']
  workflow_dispatch:
    inputs:
      policies:
        description: Policies to validate (maximum 10; no ratings or publication)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: arena-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Collect changed paths and base manifests without executing policies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/arena-input" "$RUNNER_TEMP/arena-output"
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/arena-input/changed.txt"
            python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base=os.environ['BASE_SHA']
          def read(name):
              return json.loads(subprocess.check_output(['git','show',base+':'+name]))
          registry=read('policies/registry.json')
          manifests={p['id']:read('policies/'+p['manifest']) for p in registry['policies']}
          Path(os.environ['RUNNER_TEMP'],'arena-input','base-manifests.json').write_text(json.dumps(manifests))
          PY
          fi
      - name: Validate playable submissions without rating
        env:
          POLICY_IDS: ${{ inputs.policies }}
          EVENT_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'change' }}
        run: |
          docker pull node:24-bookworm-slim
          docker image inspect node:24-bookworm-slim --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/arena-output/image.txt"
          args=(--output /output --event "$EVENT_KIND" --policies "$POLICY_IDS" --commit "$GITHUB_SHA")
          if [ -f "$RUNNER_TEMP/arena-input/changed.txt" ]; then
            args+=(--changed /input/changed.txt --base-manifests /input/base-manifests.json)
          fi
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 2g --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/app:ro" \
            -v "$RUNNER_TEMP/arena-input:/input:ro" -v "$RUNNER_TEMP/arena-output:/output" -w /app node:24-bookworm-slim \
            sh -c 'node arena/validate.mjs && node tests/arena/reference.mjs && node tests/arena/release.mjs && exec node arena/reference-ci.mjs "$@"' _ "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arena-validation-results
          path: ${{ runner.temp }}/arena-output
          retention-days: 7
          if-no-files-found: warn
