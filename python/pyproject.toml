[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "threecard-royale"
version = "0.2.0"
description = "Portable rules 1.0.0 and an optional Gymnasium environment for 3Card Royale"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
[project.optional-dependencies]
gym = ["gymnasium>=1.2,<2", "numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["."]
include = ["threecard_royale*"]
