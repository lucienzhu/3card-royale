[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "threecard-royale"
version = "0.1.1"
description = "Portable rules 0.3.8 and an optional Gymnasium environment for 3Card Royale"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
[project.optional-dependencies]
gym = ["gymnasium>=1.2,<2", "numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["."]
include = ["threecard_royale*"]
