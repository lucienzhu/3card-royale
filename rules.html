<script>(()=>{'use strict';const root=document.documentElement,body=document.getElementById('rules-body'),glance=document.getElementById('rules-glance');let last='';
const S={'♠':'s','♥':'h','♣':'c','♦':'d'};
const flower=()=>'<span class="site-card-flower" aria-hidden="true">'+window.SZFlowerMark.replace('viewBox="0 0 64 64"','viewBox="8 12 48 48"')+'</span>';
const card=(rank,suit,wild)=>'<span class="sc-card'+('hd'.includes(S[suit])?' red':'')+(wild?' wild':'')+'" aria-hidden="true"><b'+(rank==='10'?' class="ten"':'')+'>'+rank+'</b><i>'+SZSuit.svg(S[suit])+'</i>'+(wild?flower():'<span class="sc-center">'+SZSuit.svg(S[suit])+'</span>')+'</span>';
const cards=text=>{const label=text.replace(/\s+/g,' ').trim();const html=label.replace(/([2-9JQKA]|10)([♠♥♣♦])/g,(m,r,s)=>card(r,s,false)).replace(/([♥])(10|[2-9JQKA])/g,(m,s,r)=>card(r,s,true)).replace(/\s*[＋+]\s*/g,'<span class="sc-plus">+</span>');return '<span class="site-rank-cards sc-cards" role="img" aria-label="'+label+'">'+html+'</span>';};
function transform(html){html=html.replace(/<p><a href=\x22docs\/RULES[^\x22]*\x22>[^<]*<\/a><\/p>/g,'');html=html.replace(/<h1>[^<]*<\/h1>/,'');
 html=html.replace(/<section class="rules-at-a-glance">[\s\S]*?<\/section>/,m=>{glance.innerHTML=m;return '';});
 let first=true;html=html.replace(/<table>([\s\S]*?)<\/table>/g,(m,inner)=>{if(first){first=false;inner=inner.replace(/<tr>((?:<td>[\s\S]*?<\/td>){3})<td>([\s\S]*?)<\/td><\/tr>/g,(mm,cells,ex)=>'<tr>'+cells+'<td>'+cards(ex)+'</td></tr>');return '<div class="site-table-scroll"><table class="site-rank-table">'+inner+'</table></div>';}return '<div class="site-table-scroll"><table>'+inner+'</table></div>';});
 let n=0;html=html.replace(/<h2>/g,()=>'<h2 id="s'+(++n)+'">');return html;}
function paint(){
 const lang=root.lang&&root.lang.startsWith('en')?'en':'zh';if(last===lang||!window.SZStandardRules)return;
 const opened=new Set([...body.querySelectorAll('details[open]')].map(d=>d.querySelector('h2').id));
 last=lang;body.innerHTML=transform(window.SZStandardRules[lang]);let chapter=null,content=null,index=0;
 [...body.childNodes].forEach(node=>{
  if(node.nodeName==='H2'){
   chapter=document.createElement('section');chapter.className='site-rule-chapter'+(++index%2?' section-band':'');
   chapter.setAttribute('aria-labelledby',node.id);body.insertBefore(chapter,node);
   const details=document.createElement('details');details.className='site-disclosure';details.open=opened.has(node.id);
   const summary=document.createElement('summary');summary.append(node);details.append(summary);
   content=document.createElement('div');content.className='site-disclosure-body';details.append(content);chapter.append(details);
  }else if(content)content.append(node);
 });
 window.dispatchEvent(new Event('site-content-ready'));
}
new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['lang']});paint();})();</script><script src="app/site-disclosures.js?v=concise-copy1"></script></body></html>
