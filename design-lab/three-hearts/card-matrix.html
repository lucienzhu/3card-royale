<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>牌底 × 花形 × 大小 · 深圳花牌</title>
  <link rel="icon" href="../../brand-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="card-matrix.css">
  <script src="../../app/theme-tokens.js"></script>
  <script src="marks.js"></script>
  <script src="card-matrix.js" defer></script>
</head>
<body>
  <header>
    <a id="back" href="index.html?mark=bloom&amp;core=center">← 红桃实验</a>
    <button id="theme" type="button" aria-pressed="false">夜间</button>
  </header>
  <main>
    <div class="matrix-intro">
      <div><span class="eyebrow">CARD / COLOR / SCALE</span><h1>放在一起看。</h1><p>每格左边是原版，右边是红桃版。点击放大。</p></div>
      <figure class="production"><img src="../../brand-mark.svg" alt="正式版金底花牌标志"><figcaption>正式版原样<br><span>金底 · 100%</span></figcaption></figure>
    </div>
    <div class="matrix-key"><span>5 种配色 × 4 档大小 × 2 种花形</span><span id="center-note">整朵花缩放；花蕊参数固定</span></div>
    <p class="scroll-hint">左右滑动比较尺寸 →</p>
    <div class="matrix-scroll" role="region" aria-label="花牌配色与尺寸对照矩阵" tabindex="0">
      <table id="matrix"><caption>纵向看配色，横向看大小；每格：原版 / 红桃版。</caption></table>
    </div>
    <p id="load-error" hidden>暂时无法加载原版，请刷新重试。</p>
    <footer>所有花蕊统一金色。百分比只改变整朵花，牌框保持不变。</footer>
  </main>
  <dialog id="inspection" aria-labelledby="inspection-title">
    <div class="dialog-heading"><h2 id="inspection-title"></h2><button id="close" type="button" aria-label="关闭放大">×</button></div>
    <div id="inspection-pair" class="inspection-pair"></div>
    <div id="small-pair" class="small-pair"></div>
    <div class="downloads"><a id="download-original" download>原版 SVG ↓</a><a id="download-heart" download>红桃 SVG ↓</a></div>
  </dialog>
</body>
</html>
